<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LenaGreen.com is not quite ready yet. Get in touch at hi@lenagreen.com.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#112b28">
  <title>LenaGreen.com — Not quite ready yet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23112b28'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='36' fill='%23ffffff'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#112b28; --muted:#596762; --paper:#f5f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    .page { max-width:1440px; min-height:100vh; min-height:100svh; margin:auto; padding:40px 6vw 28px; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .wordmark { font-size:18px; letter-spacing:-.5px; text-decoration:none; color:inherit; }
    .wordmark span { color:var(--muted); }
    .status { font-size:13px; color:var(--muted); padding:9px 13px; border:1px solid #ccd5d0; border-radius:30px; }
    main { flex:1; display:flex; align-items:center; padding:96px 0; }
    .content { max-width:800px; }
    .eyebrow { margin:0 0 30px; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
    h1 { margin:0; font-family:Georgia,'Times New Roman',serif; font-size:clamp(56px,8vw,108px); font-weight:400; line-height:1.04; letter-spacing:-.045em; }
    h1 em { font-weight:400; }
    .description { margin:30px 0 0; max-width:470px; color:var(--muted); font-size:18px; line-height:1.75; }
    .contact { margin-top:44px; }
    .prompt { margin:0 0 14px; font-size:16px; }
    .email { display:inline-flex; padding:18px 25px; background:var(--ink); color:#fff; border-radius:4px; font-size:18px; text-decoration:none; transition:background .15s; }
    .email:hover { background:#27514a; }
    a:focus-visible { outline:3px solid #ba772d; outline-offset:6px; }
    footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; padding-top:22px; border-top:1px solid #d5ddd8; color:var(--muted); font-size:13px; line-height:1.6; }
    footer a { color:inherit; text-underline-offset:3px; }
    @media (max-width:600px) { .page { padding:26px 24px 22px; } header { align-items:flex-start; } .status { font-size:12px; } main { padding:76px 0; } h1 { font-size:clamp(50px,12vw,72px); } .description { font-size:17px; } .email { padding:17px 21px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/" aria-label="LenaGreen.com home">LenaGreen<span>.com</span></a>
      <span class="status">Site in preparation</span>
    </header>
    <main>
      <div class="content">
        <p class="eyebrow">You've found the address.</p>
        <h1>Not quite<br><em>ready yet.</em></h1>
        <p class="description">The website at LenaGreen.com isn't ready just yet. But a conversation can start anytime.</p>
        <div class="contact">
          <p class="prompt">Would you like to say hi?</p>
          <a class="email" href="mailto:hi@lenagreen.com?subject=Hello%20about%20LenaGreen.com">hi@lenagreen.com</a>
        </div>
      </div>
    </main>
    <footer>
      <span>LenaGreen.com</span>
      <span>Domain enquiries: <a href="mailto:hi@lenagreen.com?subject=Domain%20enquiry%3A%20LenaGreen.com">say hello</a></span>
    </footer>
  </div>
</body>
</html>
